<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Evgenii Lyubkin">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="soft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
    <style>
      .title { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 54px; font-weight: 700; fill: #f0f6fc; letter-spacing: -0.5px; }
      .sub { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 500; fill: #9da7b3; }
      .type { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; fill: #7ee787; }
      .cursor { fill: #7ee787; }
      .glow {
        animation: pulse 4.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      .gridline { stroke: #ffffff; stroke-opacity: 0.045; stroke-width: 1; }
      .blink {
        animation: blink 1.1s steps(1, end) infinite;
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }
      .typewrite {
        animation: typeReveal 4s steps(36, end) 0.4s both;
      }
      @keyframes typeReveal {
        from { width: 0; }
        to { width: 100%; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- soft orbs -->
    <circle class="glow" cx="980" cy="40" r="160" fill="url(#soft)"/>
    <circle class="glow" cx="180" cy="300" r="140" fill="#58a6ff" fill-opacity="0.08"/>

    <!-- subtle grid -->
    <g>
      <path class="gridline" d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200"/>
      <path class="gridline" d="M40 0 V320 M80 0 V320 M120 0 V320 M160 0 V320 M200 0 V320 M240 0 V320 M280 0 V320 M320 0 V320 M360 0 V320 M400 0 V320 M440 0 V320 M480 0 V320 M520 0 V320 M560 0 V320 M600 0 V320 M640 0 V320 M680 0 V320 M720 0 V320 M760 0 V320 M800 0 V320 M840 0 V320 M880 0 V320 M920 0 V320 M960 0 V320 M1000 0 V320 M1040 0 V320 M1080 0 V320 M1120 0 V320 M1160 0 V320"/>
    </g>

    <!-- accent bar -->
    <rect x="56" y="54" width="72" height="6" rx="3" fill="url(#accent)"/>

    <!-- glyph decor: shield / brackets -->
    <g transform="translate(980,90)" fill="none" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="2.2">
      <path d="M40 8 L72 22 V52 C72 74 56 92 40 100 C24 92 8 74 8 52 V22 Z"/>
      <path d="M28 52 L37 61 L56 40" stroke="#3fb950" stroke-opacity="0.7"/>
    </g>
    <g transform="translate(1060,175)" fill="none" stroke="#a371f7" stroke-opacity="0.35" stroke-width="2">
      <path d="M12 8 L4 28 L12 48"/>
      <path d="M28 8 L36 28 L28 48"/>
    </g>

    <text class="title" x="56" y="140">Evgenii Lyubkin</text>
    <text class="sub" x="56" y="186">Security · Web · Tools for macOS &amp; Windows</text>

    <!-- typing line via clip animation -->
    <g transform="translate(56,230)">
      <clipPath id="typeClip">
        <rect class="typewrite" x="0" y="-20" width="520" height="36"/>
      </clipPath>
      <g clip-path="url(#typeClip)">
        <text class="type" x="0" y="0">&gt; building useful tools in public</text>
      </g>
      <rect class="cursor blink" x="352" y="-14" width="9" height="20" rx="1"/>
    </g>

    <!-- bottom edge accent -->
    <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>
  </g>
</svg>
